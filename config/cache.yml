default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  # No `database:` key — falls back to the primary ActiveRecord
  # connection so Solid Cache tables live in the same Postgres database
  # as the app. Re-add `database: cache` and a `cache:` entry in
  # database.yml if cache volume warrants a split.
  <<: *default
