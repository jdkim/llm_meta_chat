# Display names for models that have ANSWERED a turn here, including ones the
# server no longer offers.
#
# WHY THIS FILE EXISTS. The history sidebar used to resolve a turn's label from
# the live catalog, so the label described what is on offer today rather than
# what actually answered. Retiring a model silently downgraded every past turn
# that used it to the bare platform name — 350 of 520 turns on production, with
# Ollama-hosted ones reading just "Ollama", which is the very case the per-model
# label was added for. New turns now capture their label when written
# (Chat#add_user_message); this file is how the turns written BEFORE that are
# repaired, via `bin/rails model_labels:backfill`.
#
# PROVENANCE. Reconstructed from llm_meta_server's git history — every revision
# of config/llm_models.yml plus the older app/models/llm_model_map.rb hash that
# preceded it. Where a model was renamed over time, the most recent name wins.
# It is a point-in-time rescue of labels that are otherwise only in git, not a
# catalog: nothing reads it at runtime, and it needs no upkeep. Models absent
# from it keep the platform fallback, which is the honest answer — a label we
# never recorded should not be invented.

