development:
  adapter: async

test:
  adapter: test

production:
  adapter: solid_cable
  # Folded into the primary database — drop `connects_to` so the
  # default ActiveRecord connection is used. If cable volume grows,
  # split it out into its own database and re-add the connects_to.
  polling_interval: 0.1.seconds
  message_retention: 1.day
